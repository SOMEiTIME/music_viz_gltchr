<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src 'self' blob:; connect-src 'self' ws:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <link rel="stylesheet" href="stylesheet.css" />
    <title>Music Visualizer GLTCHR</title>
  </head>

  <body>
    <div id="container">
      <canvas id="canvas"></canvas>
      <audio id="audio" loop></audio>
      <video id="video"
        muted
        loop
        playsinline
        hidden
      >
      </video>
    </div>
    <button type="button" id="startOverlay">CLICK TO START</button>
    <script type="module" src="script.js"></script>
  </body>

 <input type="checkbox" class="openSidebarMenu" id="openSidebarMenu">
  <label for="openSidebarMenu" class="sidebarIconToggle">
    <div class="spinner diagonal part-1"></div>
    <div class="spinner horizontal"></div>
    <div class="spinner diagonal part-2"></div>
  </label>

  <div id="sidebarMenu">
    <ul class="sidebarMenuInner">
    <p></p>
    <div>
      <input type="range" id="frameDataIncrement" name="frameDataIncrement"
             min="2" max="10" step="1">
      <label for="frameDataIncrement">Color</label>
    </div>

    <div>
      <input type="range" id="gapMultiplier" name="gapMultiplier"
             min="0" max="1" step=".01">
      <label for="gapMultiplier">Gap</label>
    </div>

    <div>
      <input type="range" id="frameDataGapMultiplier" name="frameDataGapMultiplier"
             min="0" max="5" step=".25">
      <label for="frameDataGapMultiplier">Response</label>
    </div>

    <div>
      <input type="range" id="frameDataOffsetMultiplier" name="frameDataOffsetMultiplier"
             min="0" max="2" step=".1">
      <label for="frameDataOffsetMultiplier">Visual Offset</label>
    </div>

    <div>
      <input type="range" id="frameDataHighCutoff" name="frameDataHighCutoff"
             min="0" max="255" step="1">
      <label for="frameDataHighCutoff">High End</label>
    </div>

    <div>
      <input type="range" id="frameDataLowCutoff" name="frameDataLowCutoff"
             min="0" max="255" step="1">
      <label for="frameDataLowCutoff">Low End</label>
    </div>

    <div>
      <input type="range" id="frameDataEmptyVal" name="frameDataEmptyVal"
             min="0" max="255" step="1">
      <label for="frameDataEmptyVal">Fill In</label>
    </div>

    <div>
      <input type="range" id="adjustedGapMultiplier" name="adjustedGapMultiplier"
             min="0" max="1" step=".05">
      <label for="adjustedGapMultiplier">Fidget</label>
    </div>

    <div>
      <input type="range" id="vizBarHeightMultiplier" name="vizBarHeightMultiplier"
             min="0" max="6" step=".05">
      <label for="adjustedGapMultiplier">Bars</label>
    </div>

    <form>
      <label for="videoUpload">Video file</label>
      <input type="file" id="videoUpload" accept="video/*"/>
    </form>

    <form>
      <label for="audioUpload">Audio file</label>
      <input type="file" id="audioUpload" accept="audio/*"/>
    </form>

    <form>
      <div>
        <label for="presetName">Save as: </label>
        <input type="text" id="presetName" name="presetName" placeholder = "Preset Name Here" pattern = "^[\s\w]*$"/>
      </div>

      <div>
        <div class='favoriteButtons'>
          <button name="favoriteButton" type="button">Save Preset</button>
          <button name="deleteButton" type="button">Delete Preset</button>
        </div>
      </div>
    </form>

    <form>
      <label for="presetSelect">Choose preset:</label>
      <select name="presetSelect" id="presetSelect">
      </select>
    </form>

    <div class='favoriteButtons'>
      <input type="button" class = "controlButton" id = "audioControlButton" value = "AUDIO  | |"
      accesskey = "s"></input>
      <input type="button" class = "controlButton" id = "videoControlButton" value = "VIDEO  | |"
      ></input>
    </div>

    <div>
      <span id="presetInfoLabel"></span>
      <div class='presetInfoRow'>
        <span class='presetInfo' id="audioName"></span>
        <span class='presetInfo' id="videoName"></span>
      </div>
    </div>

    </ul>
  </div>

</html>
